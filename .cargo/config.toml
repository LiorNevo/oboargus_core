# Cargo configuration for the `obolargus-core` crate.
#
# These integration tests share a single PostgreSQL test database
# (named by `TEST_DATABASE_URL`) and truncate its tables in place
# via the `tx_pool()` fixture in `src/common.rs`. Running them in
# parallel causes one test's `TRUNCATE … CASCADE` to wipe another
# test's in-flight fixture data, producing `23503` foreign-key
# violations (verified: parallel run = 28 failures, serial run = 5
# failures; the 23 extra failures are all from this contamination).
#
# Force serial execution of the test suite so the fixture's
# `TRUNCATE`-on-every-call is safe. The performance cost is
# acceptable because the obolargus_core test suite is small
# (< 100 tests). A follow-up refactor (T081 follow-up) could move
# the per-test isolation to a per-test `Transaction` so the
# `RUST_TEST_THREADS=1` override is no longer needed; see the
# `tx_pool` docs in `src/common.rs`.

[env]
RUST_TEST_THREADS = "1"
