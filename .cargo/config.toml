# Cargo configuration for the `obolargus-core` crate.
#
# The database fixture (`tx_pool()` in `src/common.rs`) serializes
# DB-backed tests with an async mutex held by `PoolGuard`. Even when
# the Rust test harness runs tests in parallel, only one database test
# can own the shared test database and run `TRUNCATE … CASCADE` at a
# time. No `RUST_TEST_THREADS` override is required.
