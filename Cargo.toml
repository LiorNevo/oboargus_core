[package]
name = "obolargus-core"
version = "0.1.0"
description = "Shared financial domain library for Obolargus"
edition.workspace = true
rust-version.workspace = true

[dependencies]
lx_engine = { path = "../lx_engine" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "rust_decimal", "uuid", "macros", "migrate"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
tracing.workspace = true

# Integration tests under `tests/` link against the crate as an external
# crate, so anything they `use` directly must also be a dev-dependency.
# These mirror the regular dependencies above and add nothing to the
# release build.
[dev-dependencies]
async-trait = "0.1"
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
