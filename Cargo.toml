[package]
name = "obolargus-core"
version = "0.1.0"
description = "Shared financial domain library for Obolargus"
edition.workspace = true
rust-version.workspace = true

[dependencies]
lx_engine = { path = "../lx_engine" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "chrono",
  "rust_decimal",
  "uuid",
  "macros",
  "migrate",
] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
futures = "0.3.34"
tracing.workspace = true
utoipa = { workspace = true, optional = true }
schemars = "1.2.3"
jsonschema = "0.60.2"
regex = "1.13.1"
tokio-util = "0.7.20"
cron = "0.17.0"
chrono-tz = "0.10.4"

[features]
openapi = ["dep:utoipa"]

# Integration tests under `tests/` link against the crate as an external
# crate, so anything they `use` directly must also be a dev-dependency.
# These mirror the regular dependencies above and add nothing to the
# release build.
[dev-dependencies]
async-trait = "0.1.92"
jsonschema = "0.60.2"
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
